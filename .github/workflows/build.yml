---
name: Docker Build/Publish Image

on:
  push:
    branches: [production]
    # Action, documentation, and Renovate-only updates must not publish an image.
    paths:
      - Dockerfile
      - .dockerignore
  schedule:
    - cron: 0 2 * * *
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: cleanup-dry-run
        type: choice
        options:
          - cleanup-dry-run
          - cleanup
          - build

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.build-date.outputs.date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Get current date
        id: build-date
        run: |
          date="$(date --utc +'%Y.%m.%d')"
          echo "DATE=${date}" >> "$GITHUB_ENV"
          echo "date=${date}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # Nightly builds must refresh Ubuntu packages and the Trunk CLI.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ github.repository }}:${{ env.DATE }}-${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DATE: ${{ needs.build.outputs.date }}
        run: |
          tag="${RELEASE_DATE}-${GITHUB_SHA::12}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release ${RELEASE_DATE}" \
            --generate-notes

  cleanup:
    if: >-
      always() &&
      ((github.event_name == 'schedule' && needs.release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'build'))
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      RETENTION_DAYS: 90
      DRY_RUN: ${{ inputs.operation == 'cleanup-dry-run' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Delete Docker Hub tags older than retention period
        shell: bash
        run: |
          namespace="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          api="https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}/tags"
          cutoff="$(date --utc --date="${RETENTION_DAYS} days ago" +'%Y-%m-%dT%H:%M:%SZ')"

          token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq --null-input \
              --arg identifier "$DOCKERHUB_USERNAME" \
              --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}')" \
            https://hub.docker.com/v2/auth/token | jq --raw-output '.access_token')"

          url="${api}?page_size=100"
          while [[ -n "$url" && "$url" != 'null' ]]; do
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${token}" \
              "$url")"

            while IFS=$'\t' read -r tag updated; do
              [[ -n "$tag" ]] || continue
              if [[ "$DRY_RUN" == 'true' ]]; then
                echo "Would delete ${tag} (last updated ${updated})"
              else
                echo "Deleting ${tag} (last updated ${updated})"
                curl --fail --silent --show-error \
                  --request DELETE \
                  --header "Authorization: Bearer ${token}" \
                  "${api}/${tag}"
              fi
            done < <(jq --raw-output \
              --arg cutoff "$cutoff" \
              '.results[]
                | select(.name | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-production$"))
                | select(.last_updated < $cutoff)
                | [.name, .last_updated]
                | @tsv' <<< "$response")

            url="$(jq --raw-output '.next // empty' <<< "$response")"
          done

  notify:
    if: always()
    needs: [build, release, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          title: "Run ${{ github.workflow }} on ${{ github.repository }}"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ ((github.event_name == 'workflow_dispatch' && inputs.operation != 'build' && needs.cleanup.result == 'success') || (needs.build.result == 'success' && needs.release.result == 'success' && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped'))) && 'success' || 'failure' }}
