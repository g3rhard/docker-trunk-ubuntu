---
name: Docker Build/Publish Image

on:
  push:
    branches: [production]
    # Action, documentation, and Renovate-only updates must not publish an image.
    paths:
      - Dockerfile
      - .dockerignore
  schedule:
    - cron: 0 2 * * 6
      timezone: Europe/Warsaw
    - cron: 0 3 1 * *
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: cleanup-dry-run
        type: choice
        options:
          - cleanup-dry-run
          - cleanup
          - build
          - promote

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        run: |
          date="$(date --utc +'%Y.%m.%d')"
          echo "DATE=${date}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # Nightly builds must refresh Ubuntu packages and the Trunk CLI.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.DATE }}-nightly
            ghcr.io/${{ github.repository }}:nightly
            ${{ github.repository }}:${{ env.DATE }}-nightly
            ${{ github.repository }}:nightly
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_date="$(date --utc +'%Y.%m.%d')"
          tag="production-${release_date}-${GITHUB_SHA::12}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Production release ${release_date}" \
            --generate-notes

  cleanup:
    if: >-
      always() &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6' &&
      needs.build.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'cleanup' || inputs.operation == 'cleanup-dry-run')))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      RETENTION_DAYS: 7
      DRY_RUN: ${{ inputs.operation == 'cleanup-dry-run' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Delete Docker Hub tags older than retention period
        shell: bash
        run: |
          namespace="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          api="https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}/tags"
          cutoff="$(date --utc --date="${RETENTION_DAYS} days ago" +'%Y-%m-%dT%H:%M:%SZ')"

          token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq --null-input \
              --arg identifier "$DOCKERHUB_USERNAME" \
              --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}')" \
            https://hub.docker.com/v2/auth/token | jq --raw-output '.access_token')"

          url="${api}?page_size=100"
          while [[ -n "$url" && "$url" != 'null' ]]; do
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${token}" \
              "$url")"

            while IFS=$'\t' read -r tag updated; do
              [[ -n "$tag" ]] || continue
              if [[ "$DRY_RUN" == 'true' ]]; then
                echo "Would delete ${tag} (last updated ${updated})"
              else
                echo "Deleting ${tag} (last updated ${updated})"
                curl --fail --silent --show-error \
                  --request DELETE \
                  --header "Authorization: Bearer ${token}" \
                  "${api}/${tag}"
              fi
            done < <(jq --raw-output \
              --arg cutoff "$cutoff" \
              '.results[]
                | select(.name != "latest" and .name != "production" and .name != "nightly")
                | select(.last_updated < $cutoff)
                | [.name, .last_updated]
                | @tsv' <<< "$response")

            url="$(jq --raw-output '.next // empty' <<< "$response")"
          done

  promote:
    if: >-
      always() &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote nightly manifests to production
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:production" \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}:nightly"

          docker buildx imagetools create \
            --tag "${GITHUB_REPOSITORY}:production" \
            --tag "${GITHUB_REPOSITORY}:latest" \
            "${GITHUB_REPOSITORY}:nightly"

  notify:
    if: always()
    needs: [build, release, cleanup, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          title: "Run ${{ github.workflow }} on ${{ github.repository }}"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'cleanup' || inputs.operation == 'cleanup-dry-run') && needs.cleanup.result == 'success') || (((github.event_name == 'workflow_dispatch' && inputs.operation == 'promote') || (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')) && needs.promote.result == 'success' && needs.release.result == 'success') || (needs.build.result == 'success' && needs.release.result == 'skipped' && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped') && needs.promote.result == 'skipped')) && 'success' || 'failure' }}
